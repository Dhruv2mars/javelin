[workspace]
members = [".", "crates/javelin-cli", "crates/javelin-collaboration", "crates/javelin-merge", "crates/javelin-node", "crates/javelin-protocol", "crates/javelin-stack"]
default-members = [".", "crates/javelin-cli", "crates/javelin-collaboration", "crates/javelin-merge", "crates/javelin-node", "crates/javelin-protocol", "crates/javelin-stack"]
resolver = "3"

[package]
name = "javelin"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "blob"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
# hooks: the Publish write-transaction cost test counts SQLite VM instructions.
rusqlite = { version = "0.40.2", features = ["bundled", "blob", "hooks"] }
tempfile = "3.27.0"
