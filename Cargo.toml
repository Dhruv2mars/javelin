[workspace]
members = [".", "crates/javelin-cli", "crates/javelin-collaboration", "crates/javelin-control", "crates/javelin-identity", "crates/javelin-merge", "crates/javelin-node", "crates/javelin-node-cloudflare", "crates/javelin-node-worker", "crates/javelin-protocol", "crates/javelin-stack"]
default-members = [".", "crates/javelin-cli", "crates/javelin-collaboration", "crates/javelin-control", "crates/javelin-identity", "crates/javelin-merge", "crates/javelin-node", "crates/javelin-node-cloudflare", "crates/javelin-node-worker", "crates/javelin-protocol", "crates/javelin-stack"]
resolver = "3"

[package]
name = "javelin"
version = "0.1.0"
edition = "2024"

# `fs` holds everything that touches a filesystem: Layer workspaces, capture, adoption,
# attachments, the outbox and path-based `Repository::init` and `open`. Without it the crate is
# the node core: World log, objects, Layers, Stack, Publish and audiences over a SQLite
# connection the caller opens, and it builds for wasm32-unknown-unknown.
[features]
default = ["fs"]
fs = ["dep:libc"]

[dependencies]
# Salts for hidden-entry commitments come from the operating system's CSPRNG.
getrandom = "0.3.4"
rusqlite = { version = "0.40.2", features = ["bundled", "blob"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.190", optional = true }

# A Worker has no OS randomness; salts come from `crypto.getRandomValues` (`.cargo/config.toml`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[dev-dependencies]
# hooks: the Publish write-transaction cost test counts SQLite VM instructions.
rusqlite = { version = "0.40.2", features = ["bundled", "blob", "hooks"] }
tempfile = "3.27.0"
# The hosted acceptance suite (tests/hosted_*.rs, U14) drives the control plane and nodes.
javelin-collaboration = { path = "crates/javelin-collaboration" }
javelin-control = { path = "crates/javelin-control" }
javelin-identity = { path = "crates/javelin-identity" }
javelin-node = { path = "crates/javelin-node" }
javelin-node-worker = { path = "crates/javelin-node-worker" }
javelin-protocol = { path = "crates/javelin-protocol" }
webauthn-authenticator-rs = { version = "=0.6.1-dev", default-features = false, features = ["softpasskey"] }
webauthn-rs = { version = "=0.6.1-dev", default-features = false, features = ["danger-allow-state-serialisation"] }
