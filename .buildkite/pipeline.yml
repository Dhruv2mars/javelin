# Buildkite CI (replaces .github/workflows now that this repo lives on Entire).
# Runs on the free hosted linux-small queue; checkout comes from the Entire plugin Buildkite adds to every job.
# Linux subset of ci.yml (fmt, clippy, tests, release build); macOS/Windows matrices need paid queues.
steps:
  - label: ":rust: fmt, clippy, test"
    key: rust
    agents: { queue: linux-small }
    timeout_in_minutes: 60
    plugins:
      - docker#v5.12.0:
          image: rust:1.99.0
          environment: [CARGO_TERM_COLOR=never, RUST_BACKTRACE=1]
    command: |
      rustup component add rustfmt clippy
      cargo fmt --all -- --check
      cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # tests assert read-only paths stay read-only, which root ignores: run them as a normal user
      useradd -m ci && chown -R ci:ci . && chmod -R a+rwX /usr/local/cargo
      su ci -c 'PATH=/usr/local/cargo/bin:$$PATH CARGO_HOME=/usr/local/cargo RUSTUP_HOME=/usr/local/rustup cargo test --locked --workspace --all-targets --all-features'

  # Gate 2's crash clause (tools/workspace-probe/README.md) on Linux; the container's
  # overlay volume takes the copy fallback. Unprivileged, like the tests.
  - label: ":boom: Gate 2 crash clause"
    key: gate2-crash
    agents: { queue: linux-small }
    timeout_in_minutes: 60
    plugins:
      - docker#v5.12.0:
          image: rust:1.99.0
          environment: [CARGO_TERM_COLOR=never]
    command: |
      cargo build --locked --release -p javelin-cli
      cargo build --locked --release -p javelin --example gate2_seed
      curl -fsSL https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-1.4.3.tgz | tar -xz -C /usr/local
      useradd -m ci && chown -R ci:ci .
      su ci -c '/usr/local/package/bin/bun tools/workspace-probe/gate2.mjs --javelin target/release/javelin --seed target/release/examples/gate2_seed --dir /tmp/gate2 --fs overlay --expect copy --out /tmp/gate2.json --only crash'

  - label: ":cloudflare: node core for wasm"
    key: wasm
    agents: { queue: linux-small }
    timeout_in_minutes: 30
    plugins:
      - docker#v5.12.0:
          image: rust:1.99.0
          environment: [CARGO_TERM_COLOR=never]
    # The Cloudflare node's wasm module, SQLite included (clang and llvm-ar build it). The
    # Worker glue (wasm-bindgen) and wrangler run where the node is deployed, not here.
    command: |
      apt-get update -qq && apt-get install -y -qq clang llvm > /dev/null
      rustup target add wasm32-unknown-unknown
      AR_wasm32_unknown_unknown=llvm-ar cargo build --locked --release --target wasm32-unknown-unknown -p javelin-node-cloudflare

  # The release script's Linux targets (tools/release, docs/releases.md), cross-compiled with
  # zig against glibc 2.28 as the macOS release machine does, staged for a loopback host.
  - label: ":package: release build (Linux)"
    key: release-linux
    agents: { queue: linux-small }
    timeout_in_minutes: 45
    plugins:
      - docker#v5.12.0:
          image: rust:1.99.0
          environment: [CARGO_TERM_COLOR=never]
    artifact_paths: "release-linux.tar"
    command: |
      apt-get update -qq && apt-get install -y -qq xz-utils > /dev/null
      curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
      echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
      tar -xJf /tmp/zig.tar.xz -C /opt
      curl -fsSL https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-1.4.3.tgz | tar -xz -C /usr/local
      export PATH=/opt/zig-x86_64-linux-0.16.0:/usr/local/package/bin:$$PATH
      cargo install --locked cargo-zigbuild --version 0.24.0
      rustup target add aarch64-unknown-linux-gnu
      git config --global --add safe.directory '*'
      bun tools/release/release.ts build --version v0.1.0-ci --targets x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu --base-url http://127.0.0.1:4873
      tar -cf release-linux.tar dist/release

  # A new developer on a plain distro: the one-line install from a loopback server, then
  # javelin init and a first publish, as a non-root user with a fresh HOME
  # (tools/release/proof.sh). arm64 runs under qemu user emulation.
  - label: ":penguin: release install proof (Linux)"
    key: release-linux-proof
    depends_on: release-linux
    agents: { queue: linux-small }
    timeout_in_minutes: 20
    command: |
      buildkite-agent artifact download release-linux.tar . && tar -xf release-linux.tar
      docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
      for platform in linux/amd64 linux/arm64; do
        echo "--- proof on ubuntu:24.04 $$platform"
        docker run --rm --platform "$$platform" -v "$$PWD:/w:ro" ubuntu:24.04 sh -c '
          set -e
          apt-get update -qq && apt-get install -y -qq curl ca-certificates python3-minimal > /dev/null
          (python3 -m http.server 4873 --bind 127.0.0.1 --directory /w/dist/release > /tmp/serve.log 2>&1 &)
          sleep 1
          useradd -m stranger
          su stranger -c "sh /w/tools/release/proof.sh http://127.0.0.1:4873 0.1.0"'
      done
