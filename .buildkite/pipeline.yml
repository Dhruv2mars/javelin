# Buildkite CI for Javelin (docs/ci.md). Every step runs on the self-hosted `mac` queue: three
# agents on Dhruv's Mac, a launchd user service (tools/ci/setup-mac-agents.sh). CI runs only
# while that Mac is on and awake; queued builds wait for it. The steps live in .buildkite/ci.sh.
#
# - macOS natively: fmt, clippy -D warnings, tests (with a failing git first on PATH), the
#   Linux release build (cargo-zigbuild, as the release machine does) and the forge.
# - Linux in Colima (arm64, .buildkite/linux.Dockerfile): clippy, tests, Gate 2's crash
#   clause, the wasm node core; the install proof runs linux/amd64 under Rosetta.
# - Warm caches: one checkout path and one cargo target dir per concurrency group, so cargo
#   rebuilds only what changed. A group runs one job at a time across builds.
# - if_changed skips steps a change cannot affect: docs and Markdown skip everything, the forge
#   runs for apps/forge, packages and the wire protocol. Main diffs against its first parent.
# - The pipeline settings upload this file from the `mac` queue and cancel superseded branch
#   builds (not main's).
# Windows has no runner; the rest of Gate 2 and the workspace probes run nowhere automatically.

agents: { queue: mac }

steps:
  - label: ":mac: fmt, clippy, test (macOS)"
    key: mac
    command: .buildkite/ci.sh mac
    # Everything but docs, Markdown and the TypeScript apps.
    if_changed: &rust
      include: ["**"]
      exclude: ["*.md", "**/*.md", "docs/**", "apps/**", "packages/**", ".github/**", "LICENSE*"]
    concurrency: 1
    concurrency_group: javelin/mac
    env: { BUILDKITE_BUILD_CHECKOUT_PATH: "${HOME}/.buildkite-agent/builds/javelin-mac" }
    priority: 2
    timeout_in_minutes: 45
    # An agent lost mid-job (the Mac slept or restarted) retries once.
    retry: &retry
      automatic: [{ exit_status: -1, limit: 1 }]

  - label: ":linux: clippy, test (Linux)"
    key: linux
    command: .buildkite/ci.sh linux
    if_changed: *rust
    concurrency: 1
    concurrency_group: javelin/linux
    env: { BUILDKITE_BUILD_CHECKOUT_PATH: "${HOME}/.buildkite-agent/builds/javelin-linux" }
    priority: 2
    timeout_in_minutes: 45
    retry: *retry

  - label: ":boom: Gate 2 crash clause (Linux)"
    key: gate2-crash
    command: .buildkite/ci.sh gate2
    if_changed: *rust
    concurrency: 1
    concurrency_group: javelin/linux-release
    env: { BUILDKITE_BUILD_CHECKOUT_PATH: "${HOME}/.buildkite-agent/builds/javelin-linux-release" }
    priority: 1
    timeout_in_minutes: 30
    retry: *retry

  - label: ":cloudflare: node core for wasm"
    key: wasm
    command: .buildkite/ci.sh wasm
    if_changed: *rust
    concurrency: 1
    concurrency_group: javelin/linux-release
    env: { BUILDKITE_BUILD_CHECKOUT_PATH: "${HOME}/.buildkite-agent/builds/javelin-linux-release" }
    timeout_in_minutes: 20
    retry: *retry

  - label: ":package: release build (Linux)"
    key: release-linux
    command: .buildkite/ci.sh release
    if_changed: *rust
    concurrency: 1
    concurrency_group: javelin/release
    env: { BUILDKITE_BUILD_CHECKOUT_PATH: "${HOME}/.buildkite-agent/builds/javelin-release" }
    artifact_paths: "release-linux.tar"
    priority: 1
    timeout_in_minutes: 30
    retry: *retry

  - label: ":penguin: release install proof (Linux)"
    key: release-linux-proof
    depends_on: release-linux
    command: .buildkite/ci.sh proof
    if_changed: *rust
    concurrency: 1
    concurrency_group: javelin/proof
    timeout_in_minutes: 20
    retry: *retry

  - label: ":globe_with_meridians: forge"
    key: forge
    command: .buildkite/ci.sh forge
    if_changed: ["apps/forge/**", "packages/**", "crates/javelin-protocol/**", ".buildkite/**"]
    concurrency: 1
    concurrency_group: javelin/mac
    env: { BUILDKITE_BUILD_CHECKOUT_PATH: "${HOME}/.buildkite-agent/builds/javelin-mac" }
    timeout_in_minutes: 20
    retry: *retry
