name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af6772622 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --locked
      - name: Run Windows unit and core contract tests
        if: runner.os == 'Windows'
        run: cargo test --locked --lib --test core_contract
      - name: Run Windows lifecycle tests serially
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: cargo test --locked --test cli_lifecycle -- --test-threads=1
      - name: Run Windows 100-Layer stress serially
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: cargo test --locked --test stress_100_layers -- --test-threads=1
      - name: Installed-binary acceptance
        if: runner.os != 'Windows'
        run: ./tests/acceptance/installed_binary.sh

  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af6772622 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: ./scripts/package-release.sh
      - name: Verify package checksum
        working-directory: dist
        run: shasum -a 256 -c ./*.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: javelin-macos-package
          path: dist/*
