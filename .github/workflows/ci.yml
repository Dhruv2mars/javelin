name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Javelin must never invoke Git. A failing git binary goes first on PATH and
      # records any call; the probe proves Rust resolves it before the tests rely on it.
      - name: Install failing git shim
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          shim="$RUNNER_TEMP/git-shim" probe="$RUNNER_TEMP/git-probe"
          mkdir -p "$shim" "$probe"
          echo 'fn main() { let d = std::env::current_exe().unwrap(); std::fs::write(d.parent().unwrap().join("invoked"), b"").unwrap(); std::process::exit(97) }' > "$probe/shim.rs"
          echo 'fn main() { std::process::exit(std::process::Command::new("git").status().ok().and_then(|s| s.code()).unwrap_or(1)) }' > "$probe/probe.rs"
          rustc -o "$shim/git$EXE" "$probe/shim.rs"
          rustc -o "$probe/probe$EXE" "$probe/probe.rs"
          PATH="$shim:$PATH" "$probe/probe$EXE" && exit 1 || test $? -eq 97
          rm "$shim/invoked"
          echo "GIT_SHIM=$shim" >> "$GITHUB_ENV"

      - name: Test with the git shim first on PATH
        run: |
          PATH="$GIT_SHIM:$PATH" cargo test --locked --workspace --all-targets --all-features
          test ! -e "$GIT_SHIM/invoked"

      # CI workflow validator (docs/ci-execution.md §10) runs on every OS in this matrix.
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Test CI workflow validator with the git shim first on PATH
        working-directory: tools/ci-validate
        run: |
          bun install --frozen-lockfile
          PATH="$GIT_SHIM:$PATH" bun test
          test ! -e "$GIT_SHIM/invoked"

      - name: Build release binary
        run: cargo build --locked --release --workspace --all-features

  # The managed node (U13): the Worker on workerd, then repo create end to end against it.
  # Local only; no Cloudflare account or credentials are used.
  node-cloudflare:
    name: Node / Cloudflare (workerd)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: tools/node-cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      # Same Git guard as the Rust job: the managed-node test drives the javelin CLI.
      - name: Install failing git shim
        run: |
          shim="$RUNNER_TEMP/git-shim" probe="$RUNNER_TEMP/git-probe"
          mkdir -p "$shim" "$probe"
          echo 'fn main() { let d = std::env::current_exe().unwrap(); std::fs::write(d.parent().unwrap().join("invoked"), b"").unwrap(); std::process::exit(97) }' > "$probe/shim.rs"
          echo 'fn main() { std::process::exit(std::process::Command::new("git").status().ok().and_then(|s| s.code()).unwrap_or(1)) }' > "$probe/probe.rs"
          rustc -o "$shim/git" "$probe/shim.rs"
          rustc -o "$probe/probe" "$probe/probe.rs"
          PATH="$shim:$PATH" "$probe/probe" && exit 1 || test $? -eq 97
          rm "$shim/invoked"
          echo "GIT_SHIM=$shim" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test on workerd with the git shim first on PATH
        run: |
          PATH="$GIT_SHIM:$PATH" bun run test
          test ! -e "$GIT_SHIM/invoked"

      # U14: gate 4 and the outage matrix against the self-hosted node and the Worker on
      # workerd. The script builds its own git stand-in with a positive control as well.
      - name: Hosted acceptance suite
        run: |
          PATH="$GIT_SHIM:$PATH" bun run ../acceptance/run.ts
          test ! -e "$GIT_SHIM/invoked"

  # Clone-backed Layers on each filesystem. Only volume setup uses sudo or admin;
  # the tests run as the ordinary runner user with no mount, helper or daemon.
  workspace:
    name: Workspace / ${{ matrix.fs }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, fs: apfs, expect: directory_clone }
          - { os: ubuntu-24.04, fs: btrfs, expect: snapshot }
          - { os: ubuntu-24.04, fs: xfs, expect: file_clone }
          - { os: ubuntu-24.04, fs: ext4, expect: copy }
          - { os: windows-2025, fs: refs, expect: file_clone }
          - { os: windows-2025, fs: ntfs, expect: copy }
    defaults:
      run:
        shell: bash
    env:
      JAVELIN_WORKSPACE_EXPECT: ${{ matrix.expect }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false

      - name: Build tests
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo test --release --locked -p javelin --test workspace_layers --no-run
          cargo test --release --locked -p javelin-cli --test cli_workspace --no-run

      - name: Runner disk
        if: matrix.fs == 'apfs' || matrix.fs == 'ext4' || matrix.fs == 'ntfs'
        run: echo "JAVELIN_WORKSPACE_TEST_DIR=$RUNNER_TEMP/workspace" >> "$GITHUB_ENV"

      - name: Linux loop image
        if: matrix.fs == 'btrfs' || matrix.fs == 'xfs'
        run: |
          sudo apt-get install -y -qq xfsprogs btrfs-progs > /dev/null
          truncate -s 6G "$RUNNER_TEMP/fs.img"
          sudo mkfs.${{ matrix.fs }} -q "$RUNNER_TEMP/fs.img" > /dev/null
          sudo mkdir -p /mnt/fs && sudo mount -o loop "$RUNNER_TEMP/fs.img" /mnt/fs
          sudo chown "$(id -u):$(id -g)" /mnt/fs
          echo "JAVELIN_WORKSPACE_TEST_DIR=/mnt/fs/workspace" >> "$GITHUB_ENV"

      - name: ReFS Dev Drive
        if: matrix.fs == 'refs'
        shell: pwsh
        run: |
          $vhd = "$env:RUNNER_TEMP\devdrive.vhdx"
          "create vdisk file=`"$vhd`" maximum=20480 type=expandable`nattach vdisk`ncreate partition primary`nassign letter=R" | Set-Content "$env:RUNNER_TEMP\dp.txt"
          diskpart /s "$env:RUNNER_TEMP\dp.txt" | Out-Null
          try { Format-Volume -DriveLetter R -DevDrive -Confirm:$false -Force | Out-Null; "devdrive=yes" }
          catch { Format-Volume -DriveLetter R -FileSystem ReFS -Confirm:$false -Force | Out-Null; "devdrive=no ($_)" }
          fsutil fsinfo volumeinfo R: | Select-String "File System Name|Block Refcounting|Supports Block"
          "JAVELIN_WORKSPACE_TEST_DIR=R:\workspace" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Test on ${{ matrix.fs }}
        run: |
          if [[ $RUNNER_OS == Linux ]]; then mkdir -p "$JAVELIN_WORKSPACE_TEST_DIR" && df -T "$JAVELIN_WORKSPACE_TEST_DIR"; fi
          [[ $RUNNER_OS == Windows ]] || [[ $(id -u) != 0 ]]
          cargo test --release --locked -p javelin --test workspace_layers -- --nocapture
          cargo test --release --locked -p javelin-cli --test cli_workspace

      - name: Measure cold base and warm Layer (20k files)
        run: |
          { echo "### ${{ matrix.fs }}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          JAVELIN_WORKSPACE_BENCH_FILES=20000 cargo test --release --locked -p javelin --test workspace_layers workspace_bench -- --ignored --nocapture 2>&1 | grep -E "built|cold|warm|record|discard|reclaim" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
