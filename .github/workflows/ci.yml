name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --locked
      - name: Run Windows unit and core contract tests
        if: runner.os == 'Windows'
        run: cargo test --locked --lib --test core_contract
      - name: Run Windows lifecycle tests serially
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: cargo test --locked --test cli_lifecycle -- --test-threads=1
      - name: Run Windows 100-Layer stress serially
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: cargo test --locked --test stress_100_layers -- --test-threads=1
      - name: Installed-binary acceptance
        if: runner.os != 'Windows'
        run: ./tests/acceptance/installed_binary.sh

  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package-release.sh
      - name: Verify package checksum
        working-directory: dist
        run: shasum -a 256 -c ./*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: javelin-macos-package
          path: dist/*
