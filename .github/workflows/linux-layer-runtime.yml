name: Linux Layer runtime

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - tools/linux-layer-runtime/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/linux-layer-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-layer-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  # Verified Linux proof dependency supplying the unchanged common probe.
  PROBE_SHA: 19224ef946f741ae8bcc292261fba8eed8d2e763

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out committed source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned common probe dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PROBE_SHA }}
          path: probe-dependency
          persist-credentials: false
          sparse-checkout: tools/workspace-probe
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Prove mounted Layer views as ordinary runner user
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.checkout.outputs.commit }}
          JAVELIN_COMMON_PROBE: ${{ github.workspace }}/probe-dependency/tools/workspace-probe/probe.mjs
        run: timeout --signal=TERM --kill-after=60s 900s bash tools/linux-layer-runtime/run.sh
      - name: Retain runtime evidence
        if: always() && env.LAYER_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-layer-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LAYER_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
