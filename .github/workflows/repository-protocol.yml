name: Repository protocol

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  protocol:
    name: Protocol / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
        working-directory: crates/javelin-protocol
    steps:
      - name: Check out committed source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          mkdir -p ci-logs
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy 2>&1 | tee ci-logs/toolchain-install.log

      - name: Record runner, compiler and source
        env:
          CHECKED_OUT_COMMIT: ${{ steps.checkout.outputs.commit }}
        run: |
          {
            printf 'commit=%s\nrunner=%s\narchitecture=%s\nimage=%s\nimage_version=%s\n' "$CHECKED_OUT_COMMIT" "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
            rustc --version --verbose
            cargo --version
            find src tests Cargo.toml Cargo.lock ../../src ../../Cargo.toml ../../Cargo.lock -type f | LC_ALL=C sort | xargs sha256sum 2>/dev/null || find src tests Cargo.toml Cargo.lock ../../src ../../Cargo.toml ../../Cargo.lock -type f | LC_ALL=C sort | xargs shasum -a 256
          } 2>&1 | tee ci-logs/environment.log

      - name: Check formatting
        run: cargo fmt --all -- --check 2>&1 | tee ci-logs/format.log

      - name: Lint protocol targets
        run: cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ci-logs/clippy.log

      - name: Install failing git shim and prove Rust resolves it
        run: |
          shim="$PWD/ci-git-shim"
          mkdir -p "$shim"
          printf '%s\n' 'fn main() {' \
            '    let dir = std::env::current_exe().unwrap().parent().unwrap().to_path_buf();' \
            '    std::fs::write(dir.join("invoked"), b"git was invoked").unwrap();' \
            '    std::process::exit(97);' '}' > "$PWD/ci-git-shim/git_shim.rs"
          printf '%s\n' 'fn main() {' \
            '    let status = std::process::Command::new("git").arg("--version").status().unwrap();' \
            '    assert_eq!(status.code(), Some(97), "Rust did not resolve the git shim");' '}' > "$PWD/ci-git-shim/git_probe.rs"
          rustc -o "$shim/git$EXE_SUFFIX" "$PWD/ci-git-shim/git_shim.rs"
          rustc -o "$PWD/ci-git-shim/git_probe$EXE_SUFFIX" "$PWD/ci-git-shim/git_probe.rs"
          PATH="$shim:$PATH" "$PWD/ci-git-shim/git_probe$EXE_SUFFIX"
          test -e "$shim/invoked"
          rm "$shim/invoked"
          echo "shim=$shim" >> "$GITHUB_ENV"
        env:
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Test protocol with the git shim first on PATH
        run: |
          PATH="$shim:$PATH" cargo test --locked --all-targets -- --nocapture 2>&1 | tee ci-logs/test.log
          test ! -e "$shim/invoked"

      - name: Build release binary
        run: cargo build --locked --release 2>&1 | tee ci-logs/release-build.log

      - name: Retain check logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: protocol-logs-${{ matrix.os }}-${{ github.run_attempt }}
          path: crates/javelin-protocol/ci-logs/
          retention-days: 14
          if-no-files-found: warn
