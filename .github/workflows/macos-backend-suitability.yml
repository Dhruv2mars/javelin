name: macOS backend suitability

on:
  pull_request:
    paths:
      - tools/macos-backend-validation/**
      - .github/workflows/macos-backend-suitability.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suitability:
    name: Bounded suitability / macos-26
    runs-on: macos-26
    timeout-minutes: 20
    env:
      PROOF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: 1
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Bounded hosted fixture and cleanup
        timeout-minutes: 17
        env:
          SUITABILITY_OUT: ${{ runner.temp }}/suitability-evidence
        shell: bash
        run: |
          ulimit -c 0
          trap 'bun tools/macos-backend-validation/runner.mjs --cleanup' EXIT INT TERM
          python3 -I tools/macos-backend-validation/audit.py --selftest
          bun tools/macos-backend-validation/runner.mjs
      - name: Audit actual raw outcomes
        if: always()
        timeout-minutes: 1
        env:
          SUITABILITY_OUT: ${{ runner.temp }}/suitability-evidence
        shell: bash
        run: |
          python3 -I tools/macos-backend-validation/audit.py "$SUITABILITY_OUT" "$PROOF_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/suitability-audit.json"
          cp "$RUNNER_TEMP/suitability-audit.json" "$SUITABILITY_OUT/audit.json"
      - name: Retain evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-suitability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/suitability-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
