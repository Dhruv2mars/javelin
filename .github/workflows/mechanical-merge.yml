name: Mechanical merge

on:
  pull_request:
    paths:
      - crates/javelin-merge/**
      - .github/workflows/mechanical-merge.yml
      - src/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  merge:
    name: Merge / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
        working-directory: crates/javelin-merge
    steps:
      - name: Check out committed source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, Node 24
        with:
          bun-version: 1.3.13

      - name: Install Rust toolchain
        run: |
          mkdir -p ci-logs
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy 2>&1 | tee ci-logs/toolchain-install.log

      - name: Record runner and compiler
        env:
          CHECKED_OUT_COMMIT: ${{ steps.checkout.outputs.commit }}
        run: |
          {
            printf 'commit=%s\nrunner=%s\narchitecture=%s\nimage=%s\nimage_version=%s\n' "$CHECKED_OUT_COMMIT" "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
            rustc --version --verbose
            cargo --version
            bun --version
            bun -e 'for (const f of process.argv.slice(1)) console.log(new Bun.CryptoHasher("sha256").update(await Bun.file(f).bytes()).digest("hex"), f)' Cargo.toml Cargo.lock src/lib.rs tests/repository_merge.rs tests/repeated_lines.rs examples/stack_preview.rs scripts/mutation-check.ts
          } 2>&1 | tee ci-logs/environment.log

      - name: Check formatting
        run: cargo fmt --all -- --check 2>&1 | tee ci-logs/format.log

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ci-logs/clippy.log

      - name: Test against real repository objects
        run: cargo test --locked --all-targets -- --nocapture 2>&1 | tee ci-logs/test.log

      - name: Run release caller example
        run: |
          root="$(mktemp -d)"
          cargo run --locked --release --example stack_preview -- "$root" 2>&1 | tee ci-logs/example.log

      - name: Require every merge guard to be test-detected
        run: bun scripts/mutation-check.ts 2>&1 | tee ci-logs/mutation.log

      - name: Retain check logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: merge-logs-${{ matrix.os }}-${{ github.run_attempt }}
          path: crates/javelin-merge/ci-logs/
          retention-days: 14
          if-no-files-found: warn
