name: macOS sparse backend attempt

on:
  pull_request:
    paths:
      - tools/macos-sparse-backend/**
      - .github/workflows/macos-sparse-backend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never
  # Unmerged PR #5 probe, pinned as a developer checkout; not accepted by this workflow.
  PROBE_COMMIT: 0e7ed045774b18819ac12f62f44ba0fdfdc641a4
  PROBE_SHA256: 617f009e1686dddfd5bacd4de007731d71e309d5a4075365235124ae7dfa0b49

jobs:
  attempt:
    name: Sparse attempt / macos-26
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: tools/macos-sparse-backend
    steps:
      - name: Check out committed source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out pinned probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PROBE_COMMIT }}
          path: probe-source
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Record source and host
        env:
          CHECKED_OUT_COMMIT: ${{ steps.checkout.outputs.commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy >/dev/null
          echo "$PROBE_SHA256  ../../probe-source/tools/workspace-probe/probe.mjs" | shasum -a 256 -c
          {
            printf 'commit=%s\nprobe_commit=%s\nimage=%s\nimage_version=%s\narch=%s\n' "$CHECKED_OUT_COMMIT" "$PROBE_COMMIT" "$ImageOS" "$ImageVersion" "$RUNNER_ARCH"
            sw_vers; rustc --version; cargo --version; bun --version
            shasum -a 256 Cargo.toml Cargo.lock src/*.rs tests/*.rs *.mjs ../../probe-source/tools/workspace-probe/*.mjs
          } 2>&1 | tee "$RUNNER_TEMP/evidence/environment.log"

      - name: Format, lint and test overlay
        run: |
          set -o pipefail
          { cargo fmt -- --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked && cargo build --locked --release; } 2>&1 | tee "$RUNNER_TEMP/evidence/cargo.log"

      - name: FSKit prerequisite and mount probe
        continue-on-error: true
        timeout-minutes: 20
        run: bun fskit-probe.mjs --work "$RUNNER_TEMP/fskit-work" --out "$RUNNER_TEMP/evidence/fskit" 2>&1 | tee "$RUNNER_TEMP/evidence/fskit.log"

      - name: Loopback NFS sparse overlay attempt
        timeout-minutes: 10
        run: |
          set -o pipefail
          bun attempt.mjs --binary target/release/macos-sparse-backend --probe ../../probe-source/tools/workspace-probe/probe.mjs \
            --work "$RUNNER_TEMP/nfs-work" --out "$RUNNER_TEMP/evidence/nfs" 2>&1 | tee "$RUNNER_TEMP/evidence/nfs.log"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-sparse-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
