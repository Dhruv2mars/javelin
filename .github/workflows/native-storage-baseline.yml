name: Native storage baseline

# Measurement only: raw samples are uploaded, no timing threshold gates the job.
# Hosted-runner numbers say nothing about other hardware, filesystem throughput,
# provider capacity or scale. Windows is unmeasured.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/native-benchmarks/**"
      - ".github/workflows/native-storage-baseline.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  baseline:
    name: Baseline / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
        working-directory: tools/native-benchmarks
    steps:
      - name: Check out committed source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          mkdir -p ../../ci-logs
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy 2>&1 | tee ../../ci-logs/toolchain-install.log

      - name: Check formatting and lint
        run: |
          cargo fmt --check 2>&1 | tee ../../ci-logs/format.log
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ../../ci-logs/clippy.log

      - name: Test the measurement tool
        run: cargo test --locked 2>&1 | tee ../../ci-logs/test.log

      - name: Build release tool
        run: cargo build --locked --release 2>&1 | tee ../../ci-logs/release-build.log

      - name: Run bounded baseline three times and verify recorded invariants
        env:
          CHECKED_OUT_COMMIT: ${{ steps.checkout.outputs.commit }}
        run: |
          for run in 1 2 3; do
            ./target/release/native-bench run --profile ci --seed 1 \
              --out "$RUNNER_TEMP/native-baseline-$run" --workdir "$RUNNER_TEMP/native-baseline-work-$run" \
              --source-commit "$CHECKED_OUT_COMMIT" 2>&1 | tee "../../ci-logs/baseline-run-$run.log"
            # A second verification pass over the raw files alone.
            ./target/release/native-bench verify "$RUNNER_TEMP/native-baseline-$run" 2>&1 | tee "../../ci-logs/baseline-verify-$run.log"
            mkdir -p ../../ci-logs/native-baseline
            cp -R "$RUNNER_TEMP/native-baseline-$run" "../../ci-logs/native-baseline/run-$run"
          done

      - name: Retain raw measurements and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: native-baseline-${{ matrix.os }}-${{ github.run_attempt }}
          path: ci-logs/
          retention-days: 14
          if-no-files-found: warn
