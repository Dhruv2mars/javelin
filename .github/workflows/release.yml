name: Release packages

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af6772622 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Assemble archive
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | sed -n 's/.*"name":"javelin","version":"\([^"]*\)".*/\1/p')
          name="javelin-$version-${{ matrix.target }}"
          mkdir -p "dist/$name/completions"
          cp "target/${{ matrix.target }}/release/javelin" "dist/$name/javelin"
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          for shell in bash elvish fish powershell zsh; do
            "dist/$name/javelin" completions "$shell" > "dist/$name/completions/javelin.$shell"
          done
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Verify archive checksum
        working-directory: dist
        run: shasum -a 256 -c ./*.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: javelin-${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af6772622 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --locked --release
      - name: Assemble archive
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $name = "javelin-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force "dist/$name/completions" | Out-Null
          Copy-Item target/release/javelin.exe "dist/$name/javelin.exe"
          Copy-Item LICENSE,README.md,CHANGELOG.md "dist/$name/"
          foreach ($shell in 'bash','elvish','fish','powershell','zsh') {
            & "dist/$name/javelin.exe" completions $shell | Out-File -Encoding utf8 "dist/$name/completions/javelin.$shell"
          }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          [System.IO.File]::WriteAllText(
            "dist/$name.zip.sha256",
            "$hash  $name.zip`n",
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Verify archive checksum
        shell: pwsh
        working-directory: dist
        run: |
          $manifest = Get-ChildItem *.sha256 | Select-Object -First 1
          $parts = (Get-Content -Raw $manifest).Trim().Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
          if ($parts.Count -ne 2) { throw "invalid checksum manifest: $manifest" }
          $actual = (Get-FileHash -Algorithm SHA256 $parts[1]).Hash.ToLower()
          if ($actual -ne $parts[0]) { throw "checksum mismatch: $($parts[1])" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: javelin-x86_64-pc-windows-msvc
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: release/*
