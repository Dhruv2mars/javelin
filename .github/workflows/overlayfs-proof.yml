name: Linux sparse Layer proof

on:
  pull_request:
    paths:
      - tools/overlayfs-proof/**
      - tools/workspace-probe/**
      - .github/workflows/overlayfs-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlayfs-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  overlayfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Record checked-out development source
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prove actual sparse mounts as ordinary runner user
        shell: bash
        run: timeout --signal=TERM --kill-after=45s 240s bash tools/overlayfs-proof/run.sh
      - name: Retain proof and failure evidence
        if: always() && env.OVERLAY_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: overlayfs-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OVERLAY_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
