name: Review permission model

on:
  pull_request:
    paths:
      - crates/javelin-collaboration/**
      - .github/workflows/review-permission-model.yml
      - docs/review-permission-model.md
      - src/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  collaboration:
    name: Collaboration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
        working-directory: crates/javelin-collaboration
    steps:
      - name: Check out committed source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          mkdir -p ci-logs
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy 2>&1 | tee ci-logs/toolchain-install.log

      - name: Record runner and compiler
        env:
          CHECKED_OUT_COMMIT: ${{ steps.checkout.outputs.commit }}
        run: |
          {
            printf 'commit=%s\nrunner=%s\narchitecture=%s\nimage=%s\nimage_version=%s\n' "$CHECKED_OUT_COMMIT" "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
            sha256sum src/lib.rs scripts/mutations.sh tests/*.rs tests/support/mod.rs examples/review_flow.rs examples/review_flow.expected Cargo.toml Cargo.lock
            rustc --version --verbose
            cargo --version
          } 2>&1 | tee ci-logs/environment.log

      - name: Check formatting
        run: cargo fmt --all -- --check 2>&1 | tee ci-logs/format.log

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ci-logs/clippy.log

      - name: Test
        run: cargo test --locked --all-targets -- --nocapture 2>&1 | tee ci-logs/test.log

      - name: Run compiled example caller and compare output
        run: |
          set -o pipefail
          cargo build --locked --release --example review_flow 2>&1 | tee ci-logs/example-build.log
          out="$RUNNER_TEMP/review-flow-repo"
          rm -rf "$out" && mkdir -p "$out"
          ./target/release/examples/review_flow "$out" | tr -d '\r' | tee ci-logs/example-output.log
          # Checkout may convert the oracle to CRLF on Windows; compare LF text.
          tr -d '\r' < examples/review_flow.expected > ci-logs/example-expected.log
          diff -u ci-logs/example-expected.log ci-logs/example-output.log 2>&1 | tee ci-logs/example-diff.log

      - name: Require tests to catch reverted guards
        if: ${{ runner.os == 'Linux' }}
        run: ./scripts/mutations.sh 2>&1 | tee ci-logs/mutations.log

      - name: Retain check logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: collaboration-logs-${{ matrix.os }}-${{ github.run_attempt }}
          path: crates/javelin-collaboration/ci-logs/
          retention-days: 14
          if-no-files-found: warn
