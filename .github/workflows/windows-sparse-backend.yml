name: Windows sparse backend proof

on:
  pull_request:
    paths:
      - tools/windows-sparse-backend/run.ps1
      - tools/windows-sparse-backend/user-run.ps1
      - tools/windows-sparse-backend/checks.mjs
      - tools/windows-sparse-backend/sparse.cpp
      - tools/windows-sparse-backend/projfs-provider.cpp
      - tools/windows-sparse-backend/hardening-repro.ps1
      - tools/windows-sparse-backend/hardening-control.cpp
      - .github/workflows/windows-sparse-backend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-sparse-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  windows-sparse:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CAPTURE_PROOF_MODE: inherited-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Attempt bounded sparse backend; verdicts come from raw evidence
        shell: pwsh
        run: ./tools/windows-sparse-backend/run.ps1
      - name: Retain raw evidence
        if: always() && env.WINDOWS_SPARSE_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-sparse-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WINDOWS_SPARSE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
