name: Diag
on:
  push:
    branches: ['diag/**']
env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never
jobs:
  diag:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: cargo test --locked -p javelin --test workspace_layers --no-run
      - name: Loop
        env:
          JAVELIN_DIAG: '1'
        run: |
          fails=0
          for i in $(seq 1 25); do
            for k in 1 2 3 4; do cargo test --locked -p javelin --test workspace_layers > out$k.txt 2>&1 & done
            wait
            for k in 1 2 3 4; do
              if ! grep -q "test result: ok" out$k.txt; then
                fails=$((fails+1)); echo "=== iteration $i copy $k FAILED"; grep -v "^\s*[0-9]*: \|^\s*at " out$k.txt | tail -400
              fi
            done
            echo "iteration $i done fails=$fails"
          done
          echo "fails=$fails"
