name: Licenses

# Checks dependency licenses, RustSec advisories, banned crates and sources
# against deny.toml. Runs only the cargo-deny check; it does not build Javelin.
# Runs on every mirrored push but is not part of CI, so the trail gate doesn't require it:
# a new RustSec advisory shows up here without blocking unrelated trails.
on:
  push:
    branches-ignore: ['archive/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          log-level: warn
