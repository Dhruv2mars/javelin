name: Layer CLI smoke

on:
  pull_request:
    paths:
      - src/**
      - crates/javelin-cli/**
      - crates/javelin-stack/**
      - crates/javelin-merge/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/layer-cli.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build CLI and helper
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo build --locked --bins
          cargo test --locked --test cli --test cli_layers
      - name: Run actual CLI through Linux paths
        shell: bash
        run: |
          set -euo pipefail
          [[ $GITHUB_ACTIONS == true && $RUNNER_ENVIRONMENT == github-hosted && $RUNNER_OS == Linux ]]
          [[ $(id -u) != 0 ]]
          parent=/var/lib/javelin-cli-ci
          [[ ! -e $parent ]]
          evidence="$RUNNER_TEMP/layer-cli-evidence"
          mkdir "$evidence"
          printf 'CLI_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          exec > >(tee "$evidence/smoke.log") 2>&1
          cleanup() {
            result=$?
            trap - EXIT
            set +e
            findmnt -rn -o TARGET | awk -v p="$parent/" 'index($0,p)==1' | sort -r > "$evidence/mounts-before-cleanup.txt"
            while IFS= read -r target; do
              sudo -n timeout 15s umount -- "$target" || result=1
            done < "$evidence/mounts-before-cleanup.txt"
            findmnt -rn -o TARGET > "$evidence/mounts-after-cleanup.txt"
            if awk -v p="$parent/" 'index($0,p)==1 { found=1 } END { exit !found }' "$evidence/mounts-after-cleanup.txt"; then
              result=1
            else
              sudo -n timeout 30s rm -rf --one-file-system -- "$parent" || result=1
            fi
            [[ ! -e "$parent" ]] || result=1
            [[ ! -e "${JAVELIN_GIT_MARKER:-$evidence/git-invoked}" ]] || result=1
            printf 'exit=%s\n' "$result" > "$evidence/result.txt"
            exit "$result"
          }
          trap cleanup EXIT
          sudo -n install -d -o root -g root -m 0755 "$parent" /usr/libexec/javelin-cli-ci /etc/javelin
          printf '%s\n' "$parent" | sudo -n tee /etc/javelin/linux-layer-parents > /dev/null
          sudo -n chmod 0644 /etc/javelin/linux-layer-parents
          sudo -n install -o root -g root -m 0755 target/debug/javelin-linux-layer-helper /usr/libexec/javelin-cli-ci/
          export JAVELIN_CLI_MOUNT_TEST=1
          export JAVELIN_CLI_RUNTIME="$parent/smoke"
          export JAVELIN_CLI_HELPER=/usr/libexec/javelin-cli-ci/javelin-linux-layer-helper
          mkdir "$evidence/guard"
          export JAVELIN_GIT_MARKER="$evidence/git-invoked"
          printf '#!/bin/sh\nprintf invoked > "$JAVELIN_GIT_MARKER"\nexit 97\n' > "$evidence/guard/git"
          chmod +x "$evidence/guard/git"
          "$evidence/guard/git" && exit 1 || [[ $? == 97 ]]
          [[ -s "$JAVELIN_GIT_MARKER" ]]
          rm "$JAVELIN_GIT_MARKER"
          export PATH="$evidence/guard:$PATH"
          uname -a
          cargo test --locked --test cli_layers binary_stack -- --nocapture
          timeout --signal=TERM --kill-after=15s 240s cargo test --locked --test cli_layers linux_cli_ -- --ignored --nocapture
          [[ ! -e "$JAVELIN_GIT_MARKER" ]]
      - name: Upload bounded smoke logs
        if: always() && env.CLI_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layer-cli-smoke-${{ github.run_id }}
          path: ${{ env.CLI_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
