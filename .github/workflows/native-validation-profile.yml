name: Native validation profile
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/native-profiles/**"
      - "docs/native-validation-profile.md"
      - ".github/workflows/native-validation-profile.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
      CARGO_TERM_COLOR: never
      NP_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      NP_ARTIFACT_NAME: native-validation-ubuntu24-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      # Bootstrap RTK without a shell or privileged installation. Every run
      # command below uses RTK. Only the pinned, checksum-verified binary is read.
      - name: Install RTK in disposable runner scratch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const zlib = require('node:zlib');
            const response = await fetch('https://github.com/rtk-ai/rtk/releases/download/v1.0.1/rtk-x86_64-unknown-linux-musl.tar.gz');
            if (!response.ok) throw new Error('RTK download failed');
            const compressed = Buffer.from(await response.arrayBuffer());
            if (crypto.createHash('sha256').update(compressed).digest('hex') !== '5b919c3bccb799b67a61866d0e617410a4fcdf173e2614440e59de2fa2003436') throw new Error('RTK checksum mismatch');
            const tar = zlib.gunzipSync(compressed);
            const dest = path.join(process.env.RUNNER_TEMP, 'native-profile-bin');
            fs.mkdirSync(dest, {recursive: true});
            let installed = false;
            for (let offset = 0; offset + 512 <= tar.length;) {
              const header = tar.subarray(offset, offset + 512);
              if (header.every(byte => byte === 0)) break;
              const name = header.subarray(0,100).toString().replace(/\0.*$/, '');
              const size = parseInt(header.subarray(124,136).toString().replace(/\0.*$/, '').trim(), 8);
              if (!Number.isSafeInteger(size) || size < 0 || offset + 512 + size > tar.length) throw new Error('invalid pinned RTK archive');
              if (path.basename(name) === 'rtk' && [0,48].includes(header[156])) {
                fs.writeFileSync(path.join(dest, 'rtk'), tar.subarray(offset+512,offset+512+size), {mode: 0o755});
                installed = true;
              }
              offset += 512 + Math.ceil(size/512)*512;
            }
            if (!installed) throw new Error('RTK binary absent');
            core.addPath(dest);
      - name: Build, check, measure and verify
        run: rtk proxy bun tools/native-profiles/ci.mjs
      - name: Retain raw failures, controls and profiler output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.NP_ARTIFACT_NAME }}
          path: tools/native-profiles/scratch/ci/
          retention-days: 14
          if-no-files-found: warn
