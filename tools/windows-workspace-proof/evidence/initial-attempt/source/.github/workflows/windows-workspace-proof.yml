name: Windows projected filesystem proof

on:
  pull_request:
    paths:
      - tools/windows-workspace-proof/**
      - .github/workflows/windows-workspace-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-workspace-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prerequisites:
    runs-on: windows-2022
    timeout-minutes: 8
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Collect actual prerequisites; backend verdict may be INCONCLUSIVE
        shell: pwsh
        run: ./tools/windows-workspace-proof/run.ps1
      - name: Retain raw prerequisite and failure evidence
        if: always() && env.WINDOWS_PROOF_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-workspace-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WINDOWS_PROOF_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
