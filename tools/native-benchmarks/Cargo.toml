[package]
name = "javelin-native-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"
description = "Release-mode public-API measurement of the native Javelin storage; not a product dependency."

[[bin]]
name = "native-bench"
path = "src/main.rs"

# Standalone: not a member of the root workspace.
[workspace]

[dependencies]
javelin = { path = "../.." }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[build-dependencies]
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
