[package]
name = "macos-sparse-backend"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded loopback NFSv3 sparse Layer experiment for macOS hosted CI"

[workspace]

[dependencies]
async-trait = "0.1"
filetime = "0.2"
nfsserve = "=0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
