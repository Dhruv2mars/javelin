[package]
name = "javelin-protocol"
version = "0.1.0"
edition = "2024"
publish = false

# `fs` is the `javelin-protocol` binary, which opens a repository by path. The node core
# depends on this crate without it.
[features]
default = ["fs"]
fs = ["javelin/fs"]

[[bin]]
name = "javelin-protocol"
path = "src/main.rs"
required-features = ["fs"]

[dependencies]
javelin = { path = "../..", default-features = false }
serde_json = "1.0"

[dev-dependencies]
javelin = { path = "../..", features = ["fs"] }
tempfile = "3.27.0"
rusqlite = "0.40.2"
