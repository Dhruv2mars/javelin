[package]
name = "javelin-node-cloudflare"
version = "0.1.0"
edition = "2024"
publish = false

# The node core on Cloudflare: built for wasm32-unknown-unknown, it runs in one Durable Object
# per repository (`tools/node-cloudflare`). The rlib lets the tests run the same node natively.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = "0.3.4"
javelin = { path = "../..", default-features = false }
javelin-collaboration = { path = "../javelin-collaboration" }
javelin-identity = { path = "../javelin-identity" }
javelin-node = { path = "../javelin-node", default-features = false }
javelin-protocol = { path = "../javelin-protocol", default-features = false }
rsqlite-vfs = "0.1.1"
rusqlite = "0.40.2"
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.81"
wasm-bindgen = "0.2.104"

[dev-dependencies]
# The parity tests run the same scenario on a self-hosted data directory.
javelin-node = { path = "../javelin-node", features = ["native"] }
tempfile = "3.27.0"
