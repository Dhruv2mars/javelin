[package]
name = "javelin-control"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64ct = { version = "1", features = ["alloc"] }
ed25519-dalek = "2"
getrandom = "0.2"
javelin = { path = "../.." }
javelin-collaboration = { path = "../javelin-collaboration" }
javelin-identity = { path = "../javelin-identity" }
javelin-node = { path = "../javelin-node" }
javelin-protocol = { path = "../javelin-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
