[package]
name = "javelin-cli"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "javelin"

[[bin]]
name = "javelin"
path = "src/main.rs"

[dependencies]
javelin = { path = "../.." }
javelin-control = { path = "../javelin-control" }
javelin-stack = { path = "../javelin-stack" }
serde_json = "1.0.154"

[dev-dependencies]
rusqlite = "0.40.2"
tempfile = "3.27.0"
# outbox replay tests run against the loopback node. Dev-only: nothing else depends on javelin-cli.
javelin-node = { path = "../javelin-node" }
javelin-protocol = { path = "../javelin-protocol" }
